<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="egyptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#egyptGrad)" />
  
  <!-- Outer Gold/Emerald Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>

  <!-- Center Badge Circle -->
  <circle cx="256" cy="256" r="140" fill="#ffffff" filter="url(#dropGlow)" />

  <!-- Arabic Typography 'ن' (Nile/HR/Kinana) with Egyptian Golden Crown/Scale motif -->
  <text x="256" y="310" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="160" font-weight="900" fill="#047857" text-anchor="middle">ن</text>

  <!-- Mini Eagle / Star Icon atop the dot of Nooun -->
  <circle cx="256" cy="190" r="18" fill="#d97706" />

  <!-- Bottom Label -->
  <rect x="156" y="415" width="200" height="42" rx="21" fill="#10b981" />
  <text x="256" y="442" font-family="'Cairo', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HR EGYPT</text>
</svg>
